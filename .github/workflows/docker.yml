name: Build and Push Docker Image

# Publishes a dual-arch image. Each architecture is built natively on its own
# runner and the two are joined into one manifest afterwards, rather than
# cross-building both on amd64 under QEMU -- emulating a Next.js build costs
# far more runner time than a second machine does.
#
# An amd64-only image is not a partial success: `docker pull` on Apple silicon
# fails outright with "no matching manifest for linux/arm64/v8", so the image
# is simply unusable there.

# The build context is NOT a bare checkout of this repo.
#
# package.json declares its @metabuilder/* dependencies as relative file: paths
# (file:../../libraries/components and friends), which resolve only in the old
# monorepo layout. assemble_workspace.py rebuilds that layout in a scratch
# directory -- this repo at frontends/postgres, its six sibling libraries under
# libraries/ -- and docker build runs with that as the context.
#
# This replaces a workflow that had never once produced an image: it built from
# `context: .`, where those paths do not exist, and started FROM
# metabuilder/base-postgres-deps, which is itself unbuildable (its Dockerfile
# wants package.json files from the eight frontends that left metabuilder, plus
# a package-lock.json committed nowhere). The Dockerfile is now self-contained.

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      # Let both archs report. The merge job needs each per-arch tag to exist,
      # so a half-built manifest is never tagged :latest regardless.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble workspace
        env:
          # Sibling repos are public today; a PAT is only needed if one is made
          # private, since the default token sees this repo alone.
          WORKSPACE_TOKEN: ${{ secrets.WORKSPACE_TOKEN }}
        run: |
          python3 .github/scripts/assemble_workspace.py --dest "${RUNNER_TEMP}/ws"

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          # The assembled workspace, not this checkout.
          context: ${{ runner.temp }}/ws
          file: ${{ github.workspace }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          # Per-arch tag only. The human-facing tags are applied by the merge
          # job, so :latest never points at a single-arch image, even briefly.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          # Scoped per arch: one shared cache key would have the two runners
          # continually evicting each other's layers.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge:
    name: Merge manifests
    needs: build
    # Nothing was pushed on a pull_request, so there is nothing to join.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          # Branch pushes get :latest plus the branch name; tag pushes get the
          # tag. Both always get the immutable :<sha>.
          tags=(--tag "$IMAGE:$SHA")
          if [ "$IS_TAG" = "true" ]; then
            tags+=(--tag "$IMAGE:$REF_NAME")
          else
            tags+=(--tag "$IMAGE:latest" --tag "$IMAGE:$REF_NAME")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "$IMAGE:${SHA}-amd64" \
            "$IMAGE:${SHA}-arm64"

      - name: Verify both platforms are in the manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$SHA"
          raw=$(docker buildx imagetools inspect "$IMAGE:$SHA" --raw)
          # The whole point of the job: a green build must not still be
          # unpullable on one of the two architectures.
          for want in amd64 arm64; do
            echo "$raw" | grep -q "\"$want\"" \
              || { echo "manifest is missing linux/$want"; exit 1; }
          done
          echo "manifest contains both linux/amd64 and linux/arm64"
